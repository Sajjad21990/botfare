# Render Blueprint for BotFare: the BotFare app, the Crema Notes demo publisher and Postgres 17.
# Paid plans so nothing sleeps or expires before judging ends. Node comes from .node-version.
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied.

services:
  - type: web
    name: botfare-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @botfare/web build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @botfare/web start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botfare-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PUBLISHER_PAYPAL_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: botfare-demo
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @botfare/demo start
    healthCheckPath: /health
    envVars:
      # host:port of botfare-web on Render's private network; the demo adds http://.
      - key: BOTFARE_URL
        fromService:
          type: web
          name: botfare-web
          property: hostport
      - key: BOTFARE_SITE_ID
        sync: false
      - key: BOTFARE_SITE_SECRET
        sync: false

databases:
  - name: botfare-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: botfare
    user: botfare
    ipAllowList: [] # private network only
