# Render Blueprint for BotFare: the BotFare app, the Crema Notes demo publisher, the daily payouts
# cron job, the weekly demo refresh cron job and Postgres 17.
# Paid plans so nothing sleeps or expires before judging ends. Node comes from .node-version, which
# pins Node 24 LTS: Node 25+ no longer bundles Corepack, and the build commands run `corepack enable`
# so pnpm matches package.json's packageManager (scripts/test/render-blueprint.test.ts checks this).
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied.

services:
  - type: web
    name: botfare-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @botfare/web build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @botfare/web start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botfare-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Seed of BotFare's receipt-signing key (signed payment, delivery and refund statements; public
      # keys at /.well-known/botfare-receipt-keys.json). Generated once; never change it in place:
      # to rotate, move the old value to BOTFARE_RECEIPT_KEY_SEED_PREVIOUS first.
      - key: BOTFARE_RECEIPT_KEY_SEED
        generateValue: true
      # Optional: retired receipt seeds, comma-separated, kept so old statements still verify.
      - key: BOTFARE_RECEIPT_KEY_SEED_PREVIOUS
        sync: false
      # Public https URL of this service, e.g. https://botfare-web.onrender.com: PayPal return URLs
      # (top-ups, Log in with PayPal), the agent API's host check, Signature-Agent, the publisher
      # snippet. The app falls back to RENDER_EXTERNAL_URL, but set it explicitly.
      - key: BOTFARE_URL
        sync: false
      # Public URL of botfare-demo (the /judge curl commands; trusted by the research agent).
      - key: DEMO_PUBLIC_URL
        sync: false
      # The demo agent key from `pnpm seed --print-secrets`, for the research agent (/agent).
      - key: BOTFARE_AGENT_KEY
        sync: false
      # "true" once the sandbox app has Log in with PayPal with the return URL
      # https://<botfare-web>.onrender.com/api/auth/paypal/callback (README).
      - key: PAYPAL_LOGIN_ENABLED
        sync: false
      # Optional: PayPal sandbox buyer (fake money) shown on /judge for approving a top-up.
      - key: JUDGE_SANDBOX_BUYER_EMAIL
        sync: false
      - key: JUDGE_SANDBOX_BUYER_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook ID of the sandbox app's webhook for https://<botfare-web>/api/paypal/webhook.
      # Until it is set the webhook route answers 503 (README "Deploy").
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PUBLISHER_PAYPAL_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: model for the analytics assistant, research agent, Fare Court and Fare Advisor (the app has a default).
      - key: ANTHROPIC_MODEL
        sync: false
      # Optional: AG Studio licence key; read at build time, removes the watermark.
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

  - type: web
    name: botfare-demo
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @botfare/demo start
    healthCheckPath: /health
    envVars:
      # host:port of botfare-web on Render's private network; the demo adds http://.
      - key: BOTFARE_URL
        fromService:
          type: web
          name: botfare-web
          property: hostport
      # Leave both empty on the first apply (the demo runs free), then fill them from
      # `pnpm seed --print-secrets` in botfare-web's Shell: see README "Deploy".
      - key: BOTFARE_SITE_ID
        sync: false
      - key: BOTFARE_SITE_SECRET
        sync: false
      # Optional: Cloudflare Turnstile secret for the human check. Empty is fine while Crema Notes
      # uses Cloudflare's test site key: botfare() always uses Cloudflare's always-pass test secret
      # for it. Set a real secret only together with that widget's site key in the dashboard.
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # Daily PayPal Payouts: one batch for every publisher with $1.00+ of earnings and a payout email,
  # then a status sync of open payouts. Idempotent, so a rerun from the dashboard is safe.
  - type: cron
    name: botfare-payouts
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 9 * * *" # 09:00 UTC daily
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm payouts:run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botfare-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        fromService:
          type: web
          name: botfare-web
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          type: web
          name: botfare-web
          envVarKey: PAYPAL_CLIENT_SECRET

  # Weekly demo refresh: a new batch of seeded traffic and the Fare Court and Fare Advisor story,
  # anchored to the run, so the dashboards and the Advisor's 14-day window never run dry while
  # judging lasts. One run key per ISO week (`seed:traffic --weekly`), so a rerun changes nothing.
  # Demo money only (`seed` postings); it needs the personas and Crema Notes from `pnpm seed`.
  - type: cron
    name: botfare-demo-refresh
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 6 * * 1" # Mondays, 06:00 UTC
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm seed:traffic --weekly
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botfare-db
          property: connectionString
      # The refresh settles, attests and refunds demo receipts, so it signs their statements with
      # botfare-web's receipt key and issuer.
      - key: BOTFARE_RECEIPT_KEY_SEED
        fromService:
          type: web
          name: botfare-web
          envVarKey: BOTFARE_RECEIPT_KEY_SEED
      - key: BOTFARE_URL
        fromService:
          type: web
          name: botfare-web
          envVarKey: BOTFARE_URL

databases:
  - name: botfare-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: botfare
    user: botfare
    ipAllowList: [] # private network only
