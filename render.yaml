# Render Blueprint for BotFare: the BotFare app, the Crema Notes demo publisher, the daily payouts
# cron job and Postgres 17.
# Paid plans so nothing sleeps or expires before judging ends. Node comes from .node-version, which
# pins Node 24 LTS: Node 25+ no longer bundles Corepack, and the build commands run `corepack enable`
# so pnpm matches package.json's packageManager (scripts/test/render-blueprint.test.ts checks this).
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied.

services:
  - type: web
    name: botfare-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @botfare/web build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @botfare/web start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botfare-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook ID of the sandbox app's webhook for https://<botfare-web>/api/paypal/webhook.
      # Until it is set the webhook route answers 503 (README "Deploy").
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PUBLISHER_PAYPAL_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: model for the analytics assistant and the research agent (the app has a default).
      - key: ANTHROPIC_MODEL
        sync: false
      # Optional: AG Studio licence key; read at build time, removes the watermark.
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

  - type: web
    name: botfare-demo
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @botfare/demo start
    healthCheckPath: /health
    envVars:
      # host:port of botfare-web on Render's private network; the demo adds http://.
      - key: BOTFARE_URL
        fromService:
          type: web
          name: botfare-web
          property: hostport
      # Leave both empty on the first apply (the demo runs free), then fill them from
      # `pnpm seed --print-secrets` in botfare-web's Shell: see README "Deploy".
      - key: BOTFARE_SITE_ID
        sync: false
      - key: BOTFARE_SITE_SECRET
        sync: false
      # Optional: Cloudflare Turnstile secret for the human check. Empty is fine while Crema Notes
      # uses Cloudflare's test site key: botfare() then uses Cloudflare's always-pass test secret.
      - key: TURNSTILE_SECRET_KEY
        sync: false

  # Daily PayPal Payouts: one batch for every publisher with $1.00+ of earnings and a payout email,
  # then a status sync of open payouts. Idempotent, so a rerun from the dashboard is safe.
  - type: cron
    name: botfare-payouts
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 9 * * *" # 09:00 UTC daily
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm payouts:run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botfare-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        fromService:
          type: web
          name: botfare-web
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          type: web
          name: botfare-web
          envVarKey: PAYPAL_CLIENT_SECRET

databases:
  - name: botfare-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: botfare
    user: botfare
    ipAllowList: [] # private network only
